# Databases the agent can query. Add, remove or describe one here: the agent re-reads this file before every
# question, so there's no code change, redeploy or restart. Each database gets its own query_<name> tool, and the
# agent looks up columns on demand with describe_tables, so schemas never go into the prompt.

# Business context the agent always gets: domain, units, conventions.
context = """
The data belongs to an Indian B2B industrial distributor. Money is INR: 1 lakh (L) = 100,000 and 1 crore (Cr) =
10,000,000, so 100 lakhs = 1 crore. Report money in lakhs, computed in SQL: ROUND(amount / 100000.0, 2) AS
amount_lakhs. A column ending in _lakhs is already in lakhs; never relabel lakhs as crores.
"""

# The dataset's "today" (the seeded data is pinned to it). Remove to use the real date.
as_of = "2026-10-08"

[databases.erp]
path = "data/erp.db"
description = "Sales and operations: customers, sales invoices, line items, payments, inventory, vendors, purchase orders"

[databases.crm]
path = "data/crm.db"
description = "Sales relationships: accounts (linked to ERP customers via erp_customer_id), contacts, activities, opportunities, NPS"
