# Supporting services: LiteLLM gateway + Langfuse tracing.
# Run once: docker compose up -d. After that, Docker restarts them whenever it starts.
name: langfuse  # same project name the Langfuse stack already uses, so its containers and data are reused

include:
  - path: [langfuse/docker-compose.yml, langfuse/docker-compose.override.yml]
    env_file: langfuse/.env

services:
  litellm:
    image: docker.litellm.ai/berriai/litellm:main-stable
    restart: always
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file: .env  # OPENROUTER_API_KEY and LITELLM_MASTER_KEY
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    ports:
      - 127.0.0.1:4000:4000
