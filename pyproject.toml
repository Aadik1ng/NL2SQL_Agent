[project]
name = "nl2sql-agent"
version = "0.1.0"
description = "Agentic SQL query engine: a LangGraph agent that plans and runs multi-step SQL over separate ERP and CRM databases"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.3",
    "langchain-openai>=1.6.7",
    "langfuse>=4.17.0",
    "langgraph>=1.2.14",
    "pydantic-ai-slim[openai]>=2.31.1",
    "rich>=15.0.0",
]
